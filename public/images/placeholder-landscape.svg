<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#e8f4f0"/>
  <rect x="0" y="280" width="600" height="120" fill="#c8e6dc"/>
  <!-- Mountains -->
  <polygon points="100,280 220,120 340,280" fill="#2d6a4f" opacity="0.5"/>
  <polygon points="200,280 340,90 480,280" fill="#1b4332" opacity="0.7"/>
  <polygon points="320,280 430,160 540,280" fill="#2d6a4f" opacity="0.4"/>
  <!-- Sun -->
  <circle cx="80" cy="90" r="40" fill="#f4a261" opacity="0.8"/>
  <!-- Jeep silhouette -->
  <rect x="220" y="300" width="160" height="50" rx="8" fill="#1b4332"/>
  <rect x="240" y="280" width="120" height="28" rx="6" fill="#2d6a4f"/>
  <circle cx="255" cy="354" r="18" fill="#333"/>
  <circle cx="255" cy="354" r="8" fill="#888"/>
  <circle cx="345" cy="354" r="18" fill="#333"/>
  <circle cx="345" cy="354" r="8" fill="#888"/>
  <!-- Wheels arch -->
  <rect x="228" y="335" width="40" height="20" rx="4" fill="#1b4332"/>
  <rect x="333" y="335" width="40" height="20" rx="4" fill="#1b4332"/>
  <!-- Text -->
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="16" fill="#555" text-anchor="middle" font-weight="bold">Belum Ada Gambar</text>
  <text x="300" y="242" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Silakan upload gambar untuk tampil di sini</text>
</svg>
